name: Publish NPM

# Runs when a GitHub release is published (the monorepo creates one per new version) and can be
# re-run manually if a publish failed. Publishes with provenance through npm trusted publishing;
# set the NPM_TOKEN secret to publish with an access token instead.

on:
  workflow_dispatch:
  release:
    types: [published]

jobs:
  publish:
    name: publish
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - name: Install dependencies
        run: |
          corepack enable
          yarn install --frozen-lockfile
      - name: Build
        run: ./scripts/build
      - name: Publish to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          npm install -g npm@11
          cd dist && npm publish --access public --provenance
